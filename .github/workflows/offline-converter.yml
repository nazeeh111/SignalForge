name: Offline converter checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install offline conversion dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.18.1 click==8.1.7
      - name: Test stored-signal conversion and output preservation
        run: python -m unittest discover -s tests -v
